[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transaction-webhook-service"
version = "0.1.0"
description = "A durable, idempotent transaction webhook processor."
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.14.1",
  "celery[redis]==5.4.0",
  "fastapi==0.115.6",
  "psycopg[binary]==3.2.3",
  "pydantic-settings==2.7.1",
  "sqlalchemy==2.0.36",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "pytest-asyncio==0.25.2",
  "ruff==0.9.2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires PostgreSQL and Redis",
  "e2e: requires the running Docker Compose stack",
]
addopts = "-ra"


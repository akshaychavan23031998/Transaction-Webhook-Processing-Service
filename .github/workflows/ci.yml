name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: transactions
          POSTGRES_USER: transaction_user
          POSTGRES_PASSWORD: transaction_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U transaction_user -d transactions"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://transaction_user:transaction_password@localhost:5432/transactions
          REDIS_URL: redis://localhost:6379/0
      - run: pytest
        env:
          DATABASE_URL: postgresql+psycopg://transaction_user:transaction_password@localhost:5432/transactions
          REDIS_URL: redis://localhost:6379/0

